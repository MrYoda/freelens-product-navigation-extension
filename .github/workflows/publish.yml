name: Publish extension

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Pin the npm 11 line: trusted publishing requires npm >=11.5.1, while
      # npm 12 changes install defaults that this pnpm-based build does not need.
      - run: npm install --global npm@11.19.0
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:package
      - run: npm publish --access public --provenance
